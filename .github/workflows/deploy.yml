name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets availability
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "status=NOT_SET" >> $GITHUB_OUTPUT
            echo "NOTICE: CF secrets not available to this repo"
          else
            echo "status=SET" >> $GITHUB_OUTPUT
          fi

      - name: Build site
        if: steps.secrets.outputs.status == 'SET'
        run: npm install && node generate.js

      - name: Create Pages project (first run)
        if: steps.secrets.outputs.status == 'SET'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages project create karvachauth --production-branch=main || echo "project already exists"

      - name: Deploy to Pages
        if: steps.secrets.outputs.status == 'SET'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy dist --project-name=karvachauth --branch=main --commit-dirty=true

      - name: Verify GSC tag live
        if: steps.secrets.outputs.status == 'SET'
        run: |
          sleep 20
          code=$(curl -s -o /tmp/kc.html -w "%{http_code}" --max-time 30 -A "Mozilla/5.0 (Linux; Android 10)" "https://karvachauth.pages.dev/")
          echo "karvachauth.pages.dev -> HTTP $code"
          grep -o 'google-site-verification" content="[^"]*' /tmp/kc.html && echo "GSC TAG LIVE" || echo "GSC TAG NOT FOUND"
